<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawings</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon-64.png">
    <link rel="apple-touch-icon" href="../assets/img/favicon-180.png">
    <script>if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark')}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css?v=20261105">
    <link rel="stylesheet" href="../css/drawings.css?v=20261105">
</head>
<body>
    <div class="dot-grid" aria-hidden="true"></div>

    <div class="viewer-shell">
        <header class="viewer-header">
            <a href="../index.html#projects" class="viewer-back" aria-label="Back to projects">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                Back
            </a>
            <span class="viewer-label">My Drawings</span>
            <div class="viewer-actions">
                <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
                </button>
            </div>
        </header>

        <main class="viewer-main">
            <div class="viewer-content" id="viewerContent" hidden>
                <div class="viewer-stage-wrap" id="stageWrap">
                    <div class="viewer-stage" id="drawingsStage">
                        <div class="viewer-fan" id="viewerFan"></div>
                        <button type="button" class="viewer-active" id="drawingImageButton" aria-label="Open drawing">
                            <img class="viewer-image" id="drawingImage" alt="">
                            <span class="viewer-specular" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <div class="viewer-caption">
                    <h1 id="drawingTitle">Untitled</h1>
                    <p id="drawingMeta">Some of my artworks</p>
                </div>

                <div class="viewer-controls">
                    <button type="button" class="viewer-arrow" id="prevDrawing" aria-label="Previous drawing">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
                    </button>
                    <div class="viewer-dots" id="drawingDots" aria-label="Drawing navigation"></div>
                    <span class="viewer-counter" id="drawingCounter">00 / 00</span>
                    <button type="button" class="viewer-arrow" id="nextDrawing" aria-label="Next drawing">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
                    </button>
                </div>
            </div>

            <div class="viewer-empty" id="drawingsEmpty">
                <strong>Drawings are on the way.</strong>
                <span>Check back soon</span>
            </div>
        </main>
    </div>

    <div class="lightbox" id="drawing-lightbox" role="dialog" aria-modal="true" aria-label="Drawing preview" hidden>
        <button type="button" class="lightbox-close" aria-label="Close drawing preview">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        </button>
        <figure class="lightbox-figure">
            <img id="drawing-lightbox-img" src="" alt="">
            <figcaption id="drawing-lightbox-caption"></figcaption>
        </figure>
    </div>

    <script src="../js/script.js?v=20261105" defer></script>
    <script src="../js/drawings.js?v=20261105" defer></script>
</body>
</html>
